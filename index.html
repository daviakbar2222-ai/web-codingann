<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktik Event - Tombol Menghindar</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #fff;
      /* background gradien yang bergerak */
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1b1464);
      background-size: 400% 400%;
      animation: gradasi 12s ease infinite;
    }
    @keyframes gradasi {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* lingkaran cahaya dekoratif */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .45;
      z-index: 0;
      animation: melayang 9s ease-in-out infinite alternate;
    }
    .orb.a { width: 320px; height: 320px; background: #ff0080; top: -80px; left: -80px; }
    .orb.b { width: 360px; height: 360px; background: #00d4ff; bottom: -100px; right: -80px; animation-delay: -4s; }
    @keyframes melayang {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.15); }
    }

    /* kartu kaca (glassmorphism) */
    .kartu {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 36px 48px;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 38px);
      background: linear-gradient(90deg, #00d4ff, #ff00c8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #pesan { margin: 0 0 18px; color: #cfd3ff; min-height: 24px; }
    .skor {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .3);
      font-size: 14px;
      letter-spacing: .5px;
    }
    .skor b { color: #00ffa6; font-size: 18px; }

    /* tombol neon */
    #tombol {
      position: fixed;
      z-index: 2;
      padding: 14px 34px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(135deg, #00c6ff, #7b2ff7);
      box-shadow: 0 0 18px rgba(0, 198, 255, .7), 0 0 40px rgba(123, 47, 247, .5);
      transition: left .25s cubic-bezier(.34, 1.56, .64, 1),
                  top  .25s cubic-bezier(.34, 1.56, .64, 1),
                  transform .2s;
      animation: denyut 1.6s ease-in-out infinite;
    }
    #tombol.kabur { transform: rotate(var(--miring)) scale(1.1); }
    @keyframes denyut {
      0%, 100% { box-shadow: 0 0 18px rgba(0,198,255,.7), 0 0 40px rgba(123,47,247,.5); }
      50%      { box-shadow: 0 0 30px rgba(0,198,255,1),  0 0 70px rgba(123,47,247,.8); }
    }

    /* efek ledakan kecil saat tombol kabur */
    .percik {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: percik .6s ease-out forwards;
    }
    @keyframes percik {
      to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <div class="kartu">
    <h1>Coba Klik Tombolnya!</h1>
    <p id="pesan">Arahkan kursor ke tombol... kalau bisa 😏</p>
    <div class="skor">Berhasil kabur: <b id="hitung">0</b> kali</div>
  </div>

  <button id="tombol">Klik Aku</button>

  <script>
    const tombol = document.getElementById("tombol");
    const pesan  = document.getElementById("pesan");
    const hitung = document.getElementById("hitung");

    const ejekan = [
      "Hampir kena! 😜", "Kurang cepat~", "Eits, meleset!",
      "Haha, coba lagi!", "Aku terlalu licin 😎", "Kok nggak bisa-bisa? 🤭",
      "Menyerah aja yuk 😂", "Wuss! Lewat! 💨"
    ];
    let jumlah = 0;

    // Efek percikan warna di posisi tombol sebelum kabur
    function percikan() {
      const r = tombol.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "percik";
        p.style.left = cx + "px";
        p.style.top  = cy + "px";
        p.style.background = `hsl(${Math.random() * 360}, 100%, 65%)`;
        p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
        p.style.setProperty("--dy", (Math.random() * 160 - 80) + "px");
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    // Pindahkan tombol ke posisi acak di dalam layar
    function pindahkan() {
      percikan();

      const maxX = window.innerWidth  - tombol.offsetWidth  - 10;
      const maxY = window.innerHeight - tombol.offsetHeight - 10;
      tombol.style.left = Math.max(10, Math.random() * maxX) + "px";
      tombol.style.top  = Math.max(10, Math.random() * maxY) + "px";

      // miring acak biar lebih lucu
      tombol.style.setProperty("--miring", (Math.random() * 30 - 15) + "deg");
      tombol.classList.add("kabur");
      setTimeout(() => tombol.classList.remove("kabur"), 250);

      jumlah++;
      hitung.textContent = jumlah;
      pesan.textContent = ejekan[Math.floor(Math.random() * ejekan.length)];
    }

    // Posisi awal
    tombol.style.left = (window.innerWidth  / 2 - tombol.offsetWidth / 2) + "px";
    tombol.style.top  = (window.innerHeight / 2 + 120) + "px";

    // EVENT: kursor menyentuh tombol -> tombol kabur
    tombol.addEventListener("mouseover", pindahkan);

    // EVENT: layar sentuh (HP)
    tombol.addEventListener("touchstart", function (e) {
      e.preventDefault();
      pindahkan();
    });
  </script>
</body>
</html>
